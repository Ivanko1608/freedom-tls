[package]
name = "ftls-client"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "ftls-client"
path = "src/main.rs"


[dependencies]
ftls-lib = { path = "../ftls-lib" }
tokio = { version = "1.52.0", features = [
  "net",
  "io-util",
  "macros",
  "rt-multi-thread",
  "time",
  "sync",
] }
tokio-rustls = "0.26.4"
webpki-roots = "1.0.7"
fast-socks5 = "1.0.0"
clap = { version = "4.6.1", features = ["derive"] }
tracing-forest = { version = "0.3.1", features = ["full"] }
tracing-subscriber = "0.3.23"
futures = { workspace = true }
tun = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
postcard = { workspace = true }
bytes = { workspace = true }
tracing = { workspace = true }
tokio-util = { workspace = true }

[dev-dependencies]
rcgen = "0.14.7"
