[workspace]
resolver = "3"
members = ["client", "server", "ftls-lib"]

[workspace.package]
license = "MIT"

[workspace.dependencies]
bytes = "1.11.1"
thiserror = "2.0.18"
anyhow = "1.0.102"
serde = "1.0.228"
postcard = { version = "1.1.3", features = ["use-std"] }
tracing = "0.1.44"
tun = { version = "0.8.9", features = ["async"] }
tokio-util = { version = "0.7.18", features = ["codec", "io"] }
futures = "0.3.32"
